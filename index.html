            ctx.fillText(t('music', Math.round(bgMusicVolume * 100)), sliderX, canvas.height * 0.38);
            
            const musicY = canvas.height * 0.42;
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.roundRect(sliderX, musicY, sliderWidth, sliderHeight, 5);
            ctx.fill();

            ctx.fillStyle = '#4ecca3';
            ctx.beginPath();
            ctx.roundRect(sliderX, musicY, sliderWidth * bgMusicVolume, sliderHeight, 5);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(t('effects', Math.round(sfxVolume * 100)), sliderX, canvas.height * 0.52);
            
            const sfxY = canvas.height * 0.56;
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.roundRect(sliderX, sfxY, sliderWidth, sliderHeight, 5);
            ctx.fill();

            ctx.fillStyle = '#4ecca3';
            ctx.beginPath();
            ctx.roundRect(sliderX, sfxY, sliderWidth * sfxVolume, sliderHeight, 5);
            ctx.fill();

            if (logoutConfirm) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 - 140, canvas.height * 0.63 - 30, 280, 50, 10);
                ctx.fill();
                ctx.fillStyle = '#ff6b6b';
                ctx.font = `bold 14px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('confirm_logout'), canvas.width / 2, canvas.height * 0.63);
            }

            drawButtons(settingsMenuButtons);
        }

        function drawShop() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(t('coins', coins), canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText(t('shop_title'), canvas.width / 2, canvas.height * 0.28);

            const now = Date.now();

            for (let btn of shopButtons) {
                let text = btn.text;
                let disabled = false;

                if (btn.id === 'BUY_TANK') {
                    if (now < fuelUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((fuelUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = t('tank_active', `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    } else if (coins < 10) disabled = true;
                }
                else if (btn.id === 'BUY_INV') {
                    if (now < inventoryUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((inventoryUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = t('inv_active', `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    } else if (coins < inventoryUpgradePrice) disabled = true;
                    else text = t('buy_inv', inventoryUpgradePrice);
                }
                else if (btn.id === 'BUY_HULL') {
                    if (now < hullUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((hullUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = t('hull_active', `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    } else if (coins < hullUpgradePrice) disabled = true;
                    else text = t('buy_hull', hullUpgradePrice);
                }
                else if (btn.id === 'BUY_ENGINE') {
                    if (engineUpgradeLevel >= 5) {
                        disabled = true;
                        text = 'МАКСИМУМ';
                    } else if (now < engineUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((engineUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = t('engine_active', `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    } else if (coins < engineUpgradePrice) disabled = true;
                    else text = t('buy_engine', engineUpgradePrice);
                }

                drawSingleButton(btn, text, disabled);
            }
        }

        function drawSkinsMenu() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(t('coins', coins), canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText(t('skins_title'), canvas.width / 2, canvas.height * 0.32);

            const skinY = canvas.height * 0.44;
            const btnWidth = Math.min(canvas.width * 0.75, 280);
            const btnHeight = Math.max(40, Math.min(canvas.height * 0.065, 48));
            const spacing = btnHeight * 0.25;

            const purchasedSkinsList = Object.values(SKINS).filter(s => s.purchased);
            
            const startIndex = skinScrollOffset;
            const endIndex = Math.min(startIndex + SKINS_PER_PAGE, purchasedSkinsList.length);
            
            let yPos = skinY;
            for (let i = startIndex; i < endIndex; i++) {
                const skin = purchasedSkinsList[i];
                const isActive = currentSkin.toLowerCase() === skin.id.toLowerCase();
                let skinName = t(skin.nameKey);
                
                let emoji = '';
                if (skin.id === 'rainbow') emoji = '🌈 ';
                else if (skin.id === 'nyan') emoji = '🐱 ';
                else if (skin.id === 'pencil') emoji = '✏️ ';
                else if (skin.id === 'gold') emoji = '⭐ ';
                else if (skin.id === 'broken') emoji = '💔 ';
                else if (skin.id === 'class') emoji = '🎓 ';
                else if (skin.id === 'glove') emoji = '🧤 ';
                else if (skin.id === 'botan') emoji = '🌿 ';
                else if (skin.id === 'orange') emoji = '🍊 ';
                else if (skin.id === 'cherry') emoji = '🍒 ';
                else if (skin.id === 'apple') emoji = '🍎 ';
                
                let displayName = emoji + skinName;
                
                const btnX = canvas.width / 2 - btnWidth / 2;
                
                ctx.fillStyle = isActive ? 'rgba(255, 215, 0, 0.15)' : 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.roundRect(btnX, yPos, btnWidth, btnHeight, 10);
                ctx.fill();
                
                ctx.strokeStyle = isActive ? '#FFD700' : 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = isActive ? 2 : 1;
                ctx.stroke();

                if (isActive) displayName = '▶ ' + displayName;
                ctx.fillStyle = isActive ? '#FFD700' : '#FFFFFF';
                const btnFontSize = Math.max(11, Math.min(btnHeight * 0.35, 14));
                ctx.font = `bold ${btnFontSize}px Arial`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(displayName, btnX + 10, yPos + btnHeight / 2);

                const previewSize = Math.min(btnHeight * 0.65, 32);
                const previewX = btnX + btnWidth - previewSize - 8;
                const previewY = yPos + (btnHeight - previewSize) / 2;
                
                const skinImg = skinImages[skin.id];
                if (skinImg && skinImg.fly && skinImg.fly.complete && skinImg.fly.naturalWidth > 0) {
                    drawRotatedImage(skinImg.fly, previewX, previewY, previewSize, previewSize * 0.66, 0);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(previewX + previewSize/2, previewY);
                    ctx.lineTo(previewX + previewSize, previewY + previewSize);
                    ctx.lineTo(previewX, previewY + previewSize);
                    ctx.closePath();
                    ctx.fill();
                }

                yPos += btnHeight + spacing;
            }

            if (skinsScrollable) {
                const totalPages = Math.ceil(purchasedSkinsList.length / SKINS_PER_PAGE);
                const currentPage = Math.floor(skinScrollOffset / SKINS_PER_PAGE) + 1;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${Math.max(10, Math.min(canvas.width * 0.025, 14))}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(`${currentPage}/${totalPages}`, canvas.width / 2, canvas.height * 0.82);
            }

            drawButtons(skinsMenuButtons);
        }

        function drawSkinsShop() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(t('coins', coins), canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText(t('skin_shop_title'), canvas.width / 2, canvas.height * 0.12);

            const allBought = checkAllSkinsBought();

            const ballSize = gachaBallSize || Math.min(canvas.width * 0.55, canvas.height * 0.40);
            const ballX = gachaBallX || canvas.width / 2;
            const ballY = gachaBallY || canvas.height * 0.45;
            
            ctx.globalAlpha = gachaBallAlpha || 1;
            if (imgBallShip && imgBallShip.complete && imgBallShip.naturalWidth > 0) {
                drawRotatedImage(imgBallShip, ballX - ballSize/2, ballY - ballSize/2, ballSize, ballSize, 0);
            } else {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballSize/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            if (gachaResultSkin && gachaPhase >= 2) {
                const resultAlpha = gachaResultAlpha || 0;
                const resultScale = gachaResultScale || 0.3;
                
                ctx.globalAlpha = resultAlpha;
                
                const skinName = getSkinName(gachaResultSkin.id);
                const nameY = canvas.height * 0.20;
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${Math.max(20, Math.min(canvas.width * 0.055, 30))}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(skinName, canvas.width / 2, nameY);
                
                const resultSize = Math.min(canvas.width * 0.4, canvas.height * 0.28) * resultScale;
                const skinImg = skinImages[gachaResultSkin.id];
                if (skinImg && skinImg.fly && skinImg.fly.complete && skinImg.fly.naturalWidth > 0) {
                    const imgX = canvas.width/2 - resultSize/2;
                    const imgY = canvas.height/2 - resultSize/2 + 10;
                    drawRotatedImage(skinImg.fly, imgX, imgY, resultSize, resultSize * 0.66, 0);
                }
                
                ctx.globalAlpha = 1;
            }

            if (!allBought && gachaAvailableSkins.length > 0 && skinGachaState === 'idle') {
                const btnWidth = Math.min(canvas.width * 0.50, 220);
                const btnHeight = Math.max(44, Math.min(canvas.height * 0.07, 52));
                const btnX = canvas.width / 2 - btnWidth / 2;
                const btnY = canvas.height * 0.74;
                
                ctx.globalAlpha = gachaButtonAlpha || 1;
                drawSingleButton({ x: btnX, y: btnY, w: btnWidth, h: btnHeight }, t('buy_skin', 10), coins < 10);
                ctx.globalAlpha = 1;
            } else if (allBought) {
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${Math.max(18, Math.min(canvas.width * 0.05, 26))}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('all_skins_bought'), canvas.width / 2, canvas.height * 0.74);
            }

            drawButtons(skinsShopButtons);
        }

        function drawButtons(buttonsList) {
            for (let btn of buttonsList) {
                drawSingleButton(btn, btn.text, false);
            }
        }

        function drawSingleButton(btn, text, disabled) {
            const paddingX = 8;
            const btnWithPadding = { 
                x: btn.x - paddingX/2, 
                y: btn.y, 
                w: btn.w + paddingX, 
                h: btn.h 
            };

            ctx.fillStyle = disabled ? 'rgba(100, 100, 100, 0.3)' : 'rgba(255, 255, 255, 0.18)';
            ctx.beginPath();
            ctx.roundRect(btnWithPadding.x, btnWithPadding.y, btnWithPadding.w, btnWithPadding.h, 10);
            ctx.fill();

            ctx.strokeStyle = disabled ? 'rgba(255, 255, 255, 0.2)' : '#FFFFFF';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = disabled ? '#888888' : '#FFFFFF';
            let btnFontSize = Math.max(10, Math.min(btn.h * 0.35, 14));
            if (text.length > 18) {
                btnFontSize = Math.max(9, btnFontSize * 0.85);
            }
            ctx.font = `bold ${btnFontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let displayText = text;
            if (text.length > 25) {
                displayText = text.substring(0, 22) + '...';
            }
            ctx.fillText(displayText, btn.x + btn.w / 2, btn.y + btn.h / 2);
        }

        function drawPauseMenu() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(26, canvas.width * 0.065)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t('pause'), canvas.width / 2, canvas.height * 0.35);

            drawButtons(pauseMenuButtons);
        }

        function drawUnpauseCountdown() {
            const remainingSec = Math.ceil((unpauseEndTime - Date.now()) / 1000);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(44, canvas.width * 0.1)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(remainingSec > 0 ? remainingSec : 'GO!', canvas.width / 2, canvas.height / 2 - 20);
        }

        function draw() {
            if (gameState === 'LOGIN_SCREEN') {
                drawLoginScreen();
                return;
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.5, '#0d0d2b');
            gradient.addColorStop(1, '#050510');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let star of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            if (gameState === 'MAIN_MENU' || gameState === 'LOGIN_SCREEN') {
                drawBgObjects();
            }

            if (gameState === 'MAIN_MENU') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawMainMenu();
            }
            else if (gameState === 'STATUS') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawStatus();
            }
            else if (gameState === 'SETTINGS') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawSettings();
            }
            else if (gameState === 'SHOP') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawShop();
            }
            else if (gameState === 'SKINS') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawSkinsMenu();
            }
            else if (gameState === 'SKINS_SHOP') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                if (skinImagesSet && skinImagesSet.fly) {
                    drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                }
                drawSkinsShop();
            }
            else if (gameState === 'WAITING_TO_START') {
                const skinImagesSet = getCurrentSkinImages();
                const isRainbow = currentSkin === 'rainbow';
                const x = rocket.x;
                const y = rocket.y;
                const w = rocket.width;
                const h = rocket.height;
                
                if (isRainbow) {
                    drawRainbowGlow(x, y, w, h);
                }
                if (skinImagesSet && skinImagesSet.idle) {
                    drawRotatedImage(skinImagesSet.idle, x, y, w, h, 0);
                }
                drawUI();

                ctx.fillStyle = '#FFFFFF';
                const hintFont = Math.max(13, Math.min(canvas.width * 0.04, 18));
                ctx.font = `bold ${hintFont}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('tap_to_start'), canvas.width / 2, canvas.height * 0.72);
            }
            else if (gameState === 'PLAYING' || gameState === 'UNPAUSING' || gameState === 'PAUSED' || gameState === 'GAMEOVER') {
                for (let p of spikeParticles) {
                    const alpha = p.life / p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                for (let spike of spikes) {
                    const spikeSize = spike.size;
                    const angle = spike.angle || 0;
                    drawRotatedImage(imgSpike, spike.x, spike.y, spikeSize, spikeSize, angle);
                }

                for (let c of canisters) {
                    drawRotatedImage(imgFuel, c.x, c.y, c.size, c.size, c.angle);
                }

                for (let coinObj of gameCoinsList) {
                    const coinImageToDraw = coinObj.isExtra ? imgExstraCoin : imgCoin;
                    drawRotatedImage(coinImageToDraw, coinObj.x, coinObj.y, coinObj.size, coinObj.size, coinObj.angle);
                }

                const skinImagesSet = getCurrentSkinImages();
                const currentTexture = rocket.velocity < 0 ? skinImagesSet.fly : skinImagesSet.idle;
                const isRainbow = currentSkin === 'rainbow';
                const x = rocket.x;
                const y = rocket.y;
                const w = rocket.width;
                const h = rocket.height;
                
                if (isRainbow) {
                    drawRainbowGlow(x, y, w, h);
                }
                if (currentTexture) {
                    drawRotatedImage(currentTexture, x, y, w, h, rocket.angle);
                }

                drawUI();

                if (gameState === 'PAUSED') drawPauseMenu();
                if (gameState === 'UNPAUSING') drawUnpauseCountdown();

                if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `bold ${Math.max(26, canvas.width * 0.075)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(t('game_over'), canvas.width / 2, canvas.height / 2 - 30);
                    
                    ctx.font = `bold ${Math.max(13, canvas.width * 0.038)}px Arial`;
                    ctx.fillText(t('tap_to_restart'), canvas.width / 2, canvas.height / 2 + 25);
                    
                    ctx.font = `bold ${Math.max(18, canvas.width * 0.05)}px monospace`;
                    ctx.fillStyle = '#FFD700';
                    ctx.fillText(formatScore(score), canvas.width / 2, canvas.height / 2 - 80);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = `${Math.max(14, canvas.width * 0.04)}px Arial`;
                    ctx.fillText(t('best', bestScore), canvas.width / 2, canvas.height / 2 - 110);
                    
                    if ((isGoldSkin() && goldScoreBonus > 0) || (isBrokenSkin() && brokenExtraBonus > 0)) {
                        ctx.fillStyle = 'rgba(255,215,0,0.4)';
                        ctx.font = `${Math.max(12, canvas.width * 0.035)}px Arial`;
                        let bonusText = '';
                        if (isGoldSkin() && goldScoreBonus > 0) bonusText += '⭐+' + goldScoreBonus + ' ';
                        if (isBrokenSkin() && brokenExtraBonus > 0) bonusText += '💔+' + brokenExtraBonus;
                        ctx.fillText(bonusText, canvas.width / 2, canvas.height / 2 - 140);
                    }
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // === ЗАГРУЗКА ===
        loadAccounts();
        loadStats();
        
        const savedUser = localStorage.getItem('flappy_rocket_current_user');
        if (savedUser && accounts[savedUser]) {
            currentUser = savedUser;
            loadUserProgress(savedUser);
            gameState = 'MAIN_MENU';
        } else {
            gameState = 'LOGIN_SCREEN';
        }

        resize();
        updateMenuButtons();
        updateLoginButtons();
        loop();

        window.addEventListener('beforeunload', function() {
            if (currentUser) {
                saveUserProgress();
                localStorage.setItem('flappy_rocket_current_user', currentUser);
            } else {
                localStorage.removeItem('flappy_rocket_current_user');
            }
        });
    </script>
</body>
</html>
