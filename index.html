    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050510">
    <title>Flappy Rocket Mobile</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            touch-action: none;
            position: fixed;
        }
        #gameContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            aspect-ratio: 9 / 16;
            background-color: #0a0a1a;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
            touch-action: none;
        }
        @media (min-aspect-ratio: 1/1) {
            canvas {
                max-height: 100vh;
                max-width: calc(100vh * 9 / 16);
                width: auto;
                height: 100vh;
            }
        }
        @media (max-aspect-ratio: 1/1) {
            canvas {
                max-width: 100vw;
                max-height: calc(100vw * 16 / 9);
                width: 100vw;
                height: auto;
            }
        }
    </style>
</head>

        // === POLYFILL для roundRect ===
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

            canisters: 0,

        function loadStats() {
            try {
                const data = localStorage.getItem('flappy_rocket_stats');
                if (data) {
                    const parsed = JSON.parse(data);
                    playerStats = { ...playerStats, ...parsed };
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        function saveStats() {
            try {
                localStorage.setItem('flappy_rocket_stats', JSON.stringify(playerStats));
            } catch (e) {
                console.error('Failed to save stats:', e);
            }
        }

        let gachaButtonAlpha = 1;
        let gachaResultAlpha = 0;
        let gachaResultScale = 0;
        let gachaAvailableSkins = [];
        let gachaBallAlpha = 1;
        let gachaShowResultTimer = 0;

        // === УЛУЧШЕННАЯ СИСТЕМА СКРОЛЛА СТАТУСА ===
        let statusScrollOffset = 0;
        const STATUS_SCROLL_SPEED = 30;
        let statusTouchStartY = 0;
        let statusTouchStartOffset = 0;
        let isStatusDragging = false;
        let statusVelocity = 0;
        let statusLastTouchY = 0;
        let statusLastTouchTime = 0;
        let statusMaxScroll = 0;
        let statusContentHeight = 0;
        let statusVisibleHeight = 0;
        let statusNeedsScroll = false;

        function initGacha() {
            gachaAvailableSkins = [];
            for (let skinId in SKINS) {
                const skin = SKINS[skinId];
                if (!skin.purchased && skinId !== 'DEFAULT') {
                    gachaAvailableSkins.push(skin);
                }
            }
            gachaAvailableSkins.sort(() => Math.random() - 0.5);
            skinGachaState = 'idle';
            gachaTimer = 0;
            gachaBallX = canvas.width / 2;
            gachaBallY = canvas.height * 0.45;
            gachaBallSize = Math.min(canvas.width * 0.55, canvas.height * 0.40);
            gachaTargetSize = gachaBallSize * 1.3;
            gachaShakeTimer = 0;
            gachaResultSkin = null;
            gachaPhase = 0;
            gachaButtonAlpha = 1;
            gachaResultAlpha = 0;
            gachaResultScale = 0;
            gachaBallAlpha = 1;
            gachaShowResultTimer = 0;
        }

        function startGacha() {
            if (gachaAvailableSkins.length === 0) return;
            if (coins < 10) {
                alert('Не хватает монет! Нужно 10 монет.');
                return;
            }
            if (skinGachaState !== 'idle') return;
            const randomIndex = Math.floor(Math.random() * gachaAvailableSkins.length);
            gachaResultSkin = gachaAvailableSkins[randomIndex];
            coins -= 10;
            saveCoins();
            skinGachaState = 'spinning';
            gachaTimer = 0;
            gachaPhase = 0;
            gachaButtonAlpha = 1;
            gachaResultAlpha = 0;
            gachaResultScale = 0.5;
            gachaBallAlpha = 1;
            gachaBallSize = Math.min(canvas.width * 0.55, canvas.height * 0.40);
            gachaTargetSize = gachaBallSize * 1.3;
            gachaBallX = canvas.width / 2;
            gachaBallY = canvas.height * 0.45;
            gachaShakeTimer = 0;
            gachaShowResultTimer = 0;
            playClick();
        }

        function updateGacha() {
            if (skinGachaState === 'spinning') {
                gachaTimer += 1/60;
                if (gachaPhase === 0) {
                    const progress = Math.min(gachaTimer / 0.5, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    gachaBallSize = Math.min(canvas.width * 0.55, canvas.height * 0.40) + 
                        (gachaTargetSize - Math.min(canvas.width * 0.55, canvas.height * 0.40)) * eased;
                    gachaBallX = canvas.width / 2;
                    gachaBallY = canvas.height * 0.45;
                    gachaButtonAlpha = 1 - eased;
                    gachaBallAlpha = 1;
                    if (progress >= 1) {
                        gachaPhase = 1;
                        gachaTimer = 0;
                        gachaShakeTimer = 3;
                    }
                }
                else if (gachaPhase === 1) {
                    gachaShakeTimer -= 1/60;
                    const intensity = Math.max(0, gachaShakeTimer / 3) * 15;
                    gachaBallX = canvas.width / 2 + (Math.random() - 0.5) * intensity;
                    gachaBallY = canvas.height * 0.45 + (Math.random() - 0.5) * intensity;
                    gachaButtonAlpha = 0;
                    gachaBallAlpha = 1;
                    if (gachaShakeTimer <= 0) {
                        gachaPhase = 2;
                        gachaTimer = 0;
                        gachaBallX = canvas.width / 2;
                        gachaBallY = canvas.height * 0.45;
                        gachaBallAlpha = 0;
                        gachaResultScale = 0.3;
                        gachaResultAlpha = 0;
                        gachaShowResultTimer = 0;
                        applySkinBonus(gachaResultSkin);
                    }
                }
                else if (gachaPhase === 2) {
                    gachaTimer += 1/60;
                    gachaShowResultTimer += 1/60;
                    if (gachaResultAlpha < 1) {
                        gachaResultAlpha = Math.min(gachaTimer / 0.8, 1);
                        gachaResultScale = 0.3 + 0.7 * gachaResultAlpha;
                    }
                    gachaButtonAlpha = 0;
                    gachaBallAlpha = 0;
                    if (gachaShowResultTimer > 3) {
                        skinGachaState = 'idle';
                        gachaBallAlpha = 1;
                        gachaButtonAlpha = 1;
                        gachaResultAlpha = 0;
                        gachaResultSkin = null;
                        gachaBallSize = Math.min(canvas.width * 0.55, canvas.height * 0.40);
                        gachaBallX = canvas.width / 2;
                        gachaBallY = canvas.height * 0.45;
                        initGacha();
                    }
                }
            }
        }

        function applySkinBonus(skin) {
            if (!skin) return;
            skin.purchased = true;
            if (!purchasedSkins.includes(skin.id)) {
                purchasedSkins.push(skin.id);
            }
            currentSkin = skin.id;
            saveSkinData();
            playerStats.totalSkins = purchasedSkins.length;
            saveStats();
            if (currentUser) saveUserProgress();
            if (skin.id === 'class') {
                classExtraScore = 500;
                saveHealth();
            }
            if (skin.id === 'botan') {
                botanExtraScore = 1000;
                saveHealth();
            }
            const index = gachaAvailableSkins.indexOf(skin);
            if (index > -1) {
                gachaAvailableSkins.splice(index, 1);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,

        function initBgObjects() {
            bgObjects = [];
            for (let i = 0; i < 8; i++) {
                const type = Math.random() < 0.5 ? 'coin' : 'canister';
                bgObjects.push({
                    type: type,
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 25 + 15,
                    speed: Math.random() * 1.5 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() * 0.02 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
                    alpha: Math.random() * 0.3 + 0.1
                });
            }
        }

        function updateBgObjects() {
            for (let obj of bgObjects) {
                obj.x -= obj.speed;
                obj.angle += obj.rotationSpeed;
                if (obj.x < -obj.size - 20) {
                    obj.x = canvas.width + Math.random() * 50;
                    obj.y = Math.random() * canvas.height;
                    obj.type = Math.random() < 0.5 ? 'coin' : 'canister';
                    obj.size = Math.random() * 25 + 15;
                    obj.speed = Math.random() * 1.5 + 0.5;
                    obj.alpha = Math.random() * 0.3 + 0.1;
                }
            }
        }

        function drawBgObjects() {
            for (let obj of bgObjects) {
                ctx.globalAlpha = obj.alpha;
                if (obj.type === 'coin') {
                    drawRotatedImage(imgCoin, obj.x, obj.y, obj.size, obj.size, obj.angle);
                } else {
                    drawRotatedImage(imgFuel, obj.x, obj.y, obj.size, obj.size, obj.angle);
                }
                ctx.globalAlpha = 1;
            }
        }

        function resize() {
            const aspectRatio = 9 / 16;
            let width = window.innerWidth;
            let height = window.innerHeight;

            if (width / height > aspectRatio) {
                canvas.height = height;
                canvas.width = height * aspectRatio;
            } else {
                canvas.width = width;
                canvas.height = width / aspectRatio;
            }

            canvas.style.position = 'absolute';
            canvas.style.left = (window.innerWidth - canvas.width) / 2 + 'px';
            canvas.style.top = (window.innerHeight - canvas.height) / 2 + 'px';

            safeTop = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 10;
            safeLeft = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-left')) || 10;

            const baseSize = Math.min(canvas.width * 0.35, canvas.height * 0.22);
            rocket.width = Math.max(85, Math.min(baseSize, 170));
            rocket.height = rocket.width * 0.66;

            if (gameState === 'WAITING_TO_START' || gameState === 'MAIN_MENU') {
                rocket.x = canvas.width * 0.02;
                rocket.y = canvas.height / 2 - rocket.height / 2;
            }

            menuRocket.width = rocket.width * 2.5;
            menuRocket.height = menuRocket.width * 0.66;
            menuRocket.x = -menuRocket.width - 100;
            menuRocket.y = canvas.height * 0.48;

            updateMenuButtons();
            updateLoginButtons();
            updateSkinsShopButtons();
            initStars();
            initBgObjects();
            
            if (gameState === 'SKINS_SHOP') {
                gachaBallX = canvas.width / 2;
                gachaBallY = canvas.height * 0.45;
                gachaBallSize = Math.min(canvas.width * 0.55, canvas.height * 0.40);
            }
            
            statusScrollOffset = 0;
            updateStatusScrollMetrics();
        }

        // === ФУНКЦИЯ РАСЧЁТА МАКСИМАЛЬНОГО СКРОЛЛА СТАТУСА ===
        function updateStatusScrollMetrics() {
            const fontSize = Math.max(14, Math.min(canvas.width * 0.035, 20));
            const lineHeight = fontSize * 1.3;
            const skinFontSize = Math.max(11, Math.min(canvas.width * 0.028, 16));
            const finalLineHeight = skinFontSize * 1.2;
            
            // Считаем количество строк в статусе
            let lineCount = 0;
            const stats = [
                t('status_total_coins', playerStats.totalCoins || 0),
                t('status_total_canisters', playerStats.totalCanisters || 0),
                t('status_total_hours', totalGameTime ? formatTime(Math.floor(totalGameTime)) : '0s'),
                t('status_total_skins', playerStats.totalSkins || 0),
                t('status_total_upgrades', playerStats.totalUpgrades || 0),
                t('status_total_score', playerStats.totalScore || 0),
                '',
                t('status_coins', coins || 0),
                t('status_canisters', fuel || 0),
                t('status_score', score || bestScore || 0),
                '',
                t('status_skins_list')
            ];
            lineCount += stats.length;
            
            // Скины
            const skinOrder = ['DEFAULT', 'CARTOON', 'RAINBOW', 'NYAN', 'PENCIL', 'GOLD', 'BROKEN', 'CLASS', 'GLOVE', 'BOTAN', 'ORANGE', 'CHERRY', 'APPLE'];
            lineCount += skinOrder.length;
            
            // Заголовок прокачек
            lineCount += 1;
            // Прокачки
            lineCount += 4;
            
            // Запас
            lineCount += 2;
            
            statusContentHeight = lineCount * lineHeight + skinOrder.length * (finalLineHeight - lineHeight) + 40;
            statusVisibleHeight = canvas.height * 0.65;
            statusMaxScroll = Math.max(0, statusContentHeight - statusVisibleHeight);
            statusNeedsScroll = statusMaxScroll > 10;
        }

        function getStatusMaxScroll() {

        function handlePressStart(e) {
            if (Date.now() < touchLockEndTime) return;
            if (gameState === 'LOGIN_SCREEN' && Date.now() < buttonsBlockEndTime) return;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const canvasX = clientX - rect.left;
            const canvasY = clientY - rect.top;

            if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return;

            if (gameState === 'LOGIN_SCREEN') {
                for (let btn of (showRegister ? registerButtons : loginButtons)) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        playClick();
                        buttonsBlocked = true;
                        buttonsBlockEndTime = Date.now() + 1000;
                        if (btn.id === 'LOGIN') {
                            handleLoginDirect();
                        } else if (btn.id === 'TO_REGISTER') {
                            showRegister = true;
                            registerInput.error = '';
                            loginInput.error = '';
                            buttonsBlocked = false;
                        } else if (btn.id === 'REGISTER') {
                            handleRegisterDirect();
                        } else if (btn.id === 'TO_LOGIN') {
                            showRegister = false;
                            loginInput.error = '';
                            registerInput.error = '';
                            buttonsBlocked = false;
                        }
                        break;
                    }
                }
            }
            else if (gameState === 'MAIN_MENU') {
                if (Date.now() < menuBlockEndTime) return;
                for (let btn of menuButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        playClick();
                        if (btn.id === 'PLAY') {
                            prepareGameWaiting();
                        }
                        else if (btn.id === 'SHOP') {
                            gameState = 'SHOP';
                            touchLockEndTime = Date.now() + 300;
                        } else if (btn.id === 'SKINS') {
                            gameState = 'SKINS';
                            skinScrollOffset = 0;
                            touchLockEndTime = Date.now() + 300;
                            updateSkinsShopButtons();
                        } else if (btn.id === 'SETTINGS') {
                            gameState = 'SETTINGS';
                            touchLockEndTime = Date.now() + 300;
                        } else if (btn.id === 'STATUS') {
                            gameState = 'STATUS';
                            touchLockEndTime = Date.now() + 300;
                            statusScrollOffset = 0;
                            updateStatusScrollMetrics();
                            refreshStatus();
                        }
                        break;
                    }
                }
            }
            else if (gameState === 'STATUS') {
                // Обработка свайпа для скролла статуса
                if (e.touches && e.touches.length === 1) {
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    const touchY = touch.clientY - rect.top;
                    const now = Date.now();
                    
                    // Проверяем, не нажата ли кнопка
                    let hitButton = false;
                    for (let btn of statusButtons) {
                        if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                            hitButton = true;
                            break;
                        }
                    }
                    
                    if (!hitButton && statusNeedsScroll) {
                        if (isStatusDragging) {
                            const delta = touchY - statusTouchStartY;
                            const newOffset = statusTouchStartOffset - delta;
                            statusScrollOffset = Math.min(Math.max(0, newOffset), statusMaxScroll);
                            statusVelocity = (statusLastTouchY - touchY) / Math.max(1, now - statusLastTouchTime);
                            statusLastTouchY = touchY;
                            statusLastTouchTime = now;
                        } else {
                            statusTouchStartY = touchY;

                                playerStats.totalUpgrades++;

        // === ОБРАБОТЧИКИ СКРОЛЛА ===
        document.addEventListener('wheel', function(e) {
            if (gameState === 'STATUS' && statusNeedsScroll) {
                e.preventDefault();
                const delta = e.deltaY * 1.5;
                statusScrollOffset = Math.min(Math.max(0, statusScrollOffset + delta), statusMaxScroll);

        // Окончание скролла с инерцией
        document.addEventListener('mouseup', function() {
            if (gameState === 'STATUS' && isStatusDragging) {
                isStatusDragging = false;
                if (Math.abs(statusVelocity) > 0.5) {
                    let vel = statusVelocity * 0.9;
                    const animateInertia = () => {
                        if (Math.abs(vel) < 0.1 || gameState !== 'STATUS') return;
                        statusScrollOffset = Math.min(Math.max(0, statusScrollOffset + vel), statusMaxScroll);
                        vel *= 0.95;
                        requestAnimationFrame(animateInertia);
                    };
                    animateInertia();
                }
                statusVelocity = 0;
            }
        });
        
        document.addEventListener('touchend', function(e) {
            if (gameState === 'STATUS' && isStatusDragging) {
                isStatusDragging = false;
                if (Math.abs(statusVelocity) > 0.5) {
                    let vel = statusVelocity * 0.9;
                    const animateInertia = () => {
                        if (Math.abs(vel) < 0.1 || gameState !== 'STATUS') return;
                        statusScrollOffset = Math.min(Math.max(0, statusScrollOffset + vel), statusMaxScroll);
                        vel *= 0.95;
                        requestAnimationFrame(animateInertia);
                    };
                    animateInertia();
                }
                statusVelocity = 0;
            }
        });

        function handleLoginDirect() {
            const username = prompt('ВХОД В АККАУНТ\nВведите имя пользователя:');
            if (username === null) {
                buttonsBlocked = false;
                return;
            }
            if (!username.trim()) {
                loginInput.error = 'Имя не может быть пустым!';
                buttonsBlocked = false;
                return;
            }
            const password = prompt('ВХОД В АККАУНТ\nВведите пароль для "' + username.trim() + '":');
            if (password === null) {
                buttonsBlocked = false;
                return;
            }
            if (!password.trim()) {
                loginInput.error = 'Пароль не может быть пустым!';
                buttonsBlocked = false;
                return;
            }

            const userData = loginAccount(username.trim(), password.trim());
            if (userData) {
                currentUser = username.trim();
                loadUserProgress(username.trim());
                gameState = 'MAIN_MENU';
                loginInput.error = '';
                logoutConfirm = false;
                localStorage.setItem('flappy_rocket_current_user', username.trim());
                updateMenuButtons();
                if (bgMusic) bgMusic.volume = bgMusicVolume;
                buttonsBlocked = false;
            } else {
                loginInput.error = t('login_error');
                buttonsBlocked = false;
            }
        }

        function handleRegisterDirect() {
            const username = prompt('РЕГИСТРАЦИЯ\nПридумайте имя пользователя (минимум 2 символа, только буквы, цифры, _ и -):');
            if (username === null) {
                buttonsBlocked = false;
                return;
            }
            if (!username.trim()) {
                registerInput.error = 'Имя не может быть пустым!';
                buttonsBlocked = false;
                return;
            }
            if (username.trim().length < 2) {
                registerInput.error = t('register_error_name_length');
                buttonsBlocked = false;
                return;
            }
            const validNameChars = /^[a-zA-Z0-9_-]+$/;
            if (!validNameChars.test(username.trim())) {
                registerInput.error = t('register_error_chars');
                buttonsBlocked = false;
                return;
            }
            if (accounts[username.trim()]) {
                registerInput.error = t('register_error_username');
                buttonsBlocked = false;
                return;
            }

            const password = prompt('РЕГИСТРАЦИЯ\nПридумайте пароль для "' + username.trim() + '"\n(Минимум 6 символов, допустимы: латиница, цифры, *()?%№#)');
            if (password === null) {
                buttonsBlocked = false;
                return;
            }
            if (!password.trim()) {
                registerInput.error = 'Пароль не может быть пустым!';
                buttonsBlocked = false;
                return;
            }
            if (password.trim().length < 6) {
                registerInput.error = t('register_error_length');
                buttonsBlocked = false;
                return;
            }

            const validChars = /^[a-zA-Z0-9*()?%№#]+$/;
            if (!validChars.test(password.trim())) {
                registerInput.error = t('register_error_chars');
                buttonsBlocked = false;
                return;
            }

            let passwordExists = false;
            for (let acc in accounts) {
                if (accounts[acc].password === password.trim()) {
                    passwordExists = true;
                    break;
                }
            }
            if (passwordExists) {
                registerInput.error = 'Такой пароль уже используется!';
                buttonsBlocked = false;
                return;
            }

            const confirm = prompt('РЕГИСТРАЦИЯ\nПодтвердите пароль для "' + username.trim() + '":');
            if (confirm === null) {
                buttonsBlocked = false;
                return;
            }
            if (password.trim() !== confirm.trim()) {
                registerInput.error = t('register_error_match');
                buttonsBlocked = false;
                return;
            }

            if (createAccount(username.trim(), password.trim())) {
                currentUser = username.trim();
                loadUserProgress(username.trim());
                gameState = 'MAIN_MENU';
                registerInput.error = '';
                logoutConfirm = false;
                localStorage.setItem('flappy_rocket_current_user', username.trim());
                updateMenuButtons();
                if (bgMusic) bgMusic.volume = bgMusicVolume;
                buttonsBlocked = false;
            } else {
                registerInput.error = t('register_error_general');
                buttonsBlocked = false;
            }
        }

        function refreshStatus() {
            playerStats.totalSkins = purchasedSkins.length;
            playerStats.totalUpgrades = (fuelUpgradeExpireTime > Date.now() ? 1 : 0) + (inventoryUpgradeExpireTime > Date.now() ? 1 : 0) + (hullUpgradeExpireTime > Date.now() ? 1 : 0) + (engineUpgradeExpireTime > Date.now() ? 1 : 0);
            playerStats.coins = coins;
            playerStats.canisters = fuel;
            playerStats.score = score || bestScore;
            saveStats();
            if (currentUser) saveUserProgress();
            updateStatusScrollMetrics();
        }

        window.addEventListener('mousedown', handlePressStart);
        window.addEventListener('touchstart', handlePressStart, { passive: false });

        let isDraggingSlider = false;
        let dragSliderType = '';

        function handleSliderDrag(e) {
            if (!isDraggingSlider) return;
            e.preventDefault();

            let clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            const rect = canvas.getBoundingClientRect();
            const canvasX = clientX - rect.left;
            const sliderWidth = Math.min(canvas.width * 0.7, 280);
            const sliderX = canvas.width / 2 - sliderWidth / 2;

            if (canvasX >= sliderX && canvasX <= sliderX + sliderWidth) {
                if (dragSliderType === 'music') {
                    bgMusicVolume = Math.max(0, Math.min(1, (canvasX - sliderX) / sliderWidth));
                    saveSettings();
                } else if (dragSliderType === 'sfx') {
                    sfxVolume = Math.max(0, Math.min(1, (canvasX - sliderX) / sliderWidth));
                    saveSettings();
                }
            }
        }

        function startSliderDrag(e) {
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const canvasX = clientX - rect.left;
            const canvasY = clientY - rect.top;

            if (gameState !== 'SETTINGS') return;

            const sliderWidth = Math.min(canvas.width * 0.7, 280);
            const sliderHeight = 24;
            const sliderX = canvas.width / 2 - sliderWidth / 2;
            
            const musicSliderY = canvas.height * 0.42;
            if (canvasX >= sliderX && canvasX <= sliderX + sliderWidth && canvasY >= musicSliderY - 10 && canvasY <= musicSliderY + sliderHeight + 10) {
                isDraggingSlider = true;
                dragSliderType = 'music';
                bgMusicVolume = Math.max(0, Math.min(1, (canvasX - sliderX) / sliderWidth));
                saveSettings();
                return;
            }

            const sfxSliderY = canvas.height * 0.56;
            if (canvasX >= sliderX && canvasX <= sliderX + sliderWidth && canvasY >= sfxSliderY - 10 && canvasY <= sfxSliderY + sliderHeight + 10) {
                isDraggingSlider = true;
                dragSliderType = 'sfx';
                sfxVolume = Math.max(0, Math.min(1, (canvasX - sliderX) / sliderWidth));
                saveSettings();
                return;
            }
        }

        function endSliderDrag(e) {
            isDraggingSlider = false;
            dragSliderType = '';
        }

        window.addEventListener('mousedown', startSliderDrag);
        window.addEventListener('touchstart', startSliderDrag, { passive: false });
        window.addEventListener('mousemove', handleSliderDrag);
        window.addEventListener('touchmove', handleSliderDrag, { passive: false });
        window.addEventListener('mouseup', endSliderDrag);
        window.addEventListener('touchend', endSliderDrag);

        function prepareGameWaiting() {
            rocket.x = canvas.width * 0.02;
            rocket.y = canvas.height / 2 - rocket.height / 2;
            rocket.velocity = 0;
            rocket.angle = 0;
            score = 0;
            scoreTimer = 0;
            goldScoreBonus = 0;
            brokenExtraBonus = 0;
            saveGoldBonus();
            saveBrokenBonus();
            cherryTeleportUsed = false;
            saveHealth();
            
            let brokenPenalty = 0;
            let startScore = 0;
            
            if (isClassSkin()) {
                startScore += classExtraScore;
            }
            if (isBotanSkin()) {
                startScore += botanExtraScore;
            }
            if (isBrokenSkin()) {
                brokenPenalty = 1;
            }
            
            const hullBonus = hullUpgradeCount;
            
            currentHealth = maxHealth + hullBonus - brokenPenalty;
            if (currentHealth < 1) currentHealth = 1;
            
            score = startScore;
            
            spikes = [];
            spikeParticles = [];
            coinsCollected = 0;
            canistersCollected = 0;

            const isUpgradeActive = Date.now() < fuelUpgradeExpireTime;
            fuel = isUpgradeActive ? 10 : 5;

            hasBonusTime = false;
            canisters = [];
            gameCoinsList = [];
            gameState = 'WAITING_TO_START';
            gameStartTime = Date.now();
        }

        function startPlaying() {
            nextFuelTime = Date.now() + 3000;
            nextCanisterTime = Date.now() + Math.random() * 4000 + 4000;
            nextCoinTime = Date.now() + Math.random() * 7000 + 8000;
            nextSpikeTime = Date.now() + Math.random() * 5000 + 7000;
            rocket.velocity = rocket.lift;
            gameState = 'PLAYING';
            scoreTimer = Date.now();
            lastGameTimeUpdate = Date.now();
        }

        function formatScore(val) {
            return String(Math.floor(val)).padStart(6, '0');
        }

        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return `${hours}h ${minutes}m ${secs}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        function update() {
            const now = Date.now();
            
            if (gameState !== 'LOGIN_SCREEN' && gameState !== 'WAITING_TO_START' && gameState !== 'PAUSED' && gameState !== 'UNPAUSING') {
                const deltaTime = (now - lastGameTimeUpdate) / 1000;
                if (deltaTime > 0 && deltaTime < 10) {
                    totalGameTime += deltaTime;
                    playerStats.totalHours = totalGameTime / 3600;
                }
                lastGameTimeUpdate = now;
            }
            
            if (gameState !== 'LOGIN_SCREEN' && gameState !== 'WAITING_TO_START' && gameState !== 'PAUSED' && gameState !== 'UNPAUSING') {
                for (let star of stars) {
                    star.x -= star.speed * 1.5;
                    if (star.x < 0) {
                        star.x = canvas.width + Math.random() * 20;
                        star.y = Math.random() * canvas.height;
                    }
                }
                if (gameState === 'MAIN_MENU' || gameState === 'LOGIN_SCREEN') {
                    updateBgObjects();
                }
            }

            if (gameState === 'MAIN_MENU' || gameState === 'SHOP' || gameState === 'SKINS' || gameState === 'SKINS_SHOP' || gameState === 'SETTINGS' || gameState === 'STATUS') {
                menuRocket.time += 0.05;
                menuRocket.x += 6.5;
                menuRocket.y = (canvas.height * 0.48) + Math.sin(menuRocket.time) * 20;

                if (menuRocket.x > canvas.width + menuRocket.width + 50) {
                    menuRocket.x = -menuRocket.width - 100;
                }
            }

            if (gameState === 'UNPAUSING') {
                if (now >= unpauseEndTime) {
                    const totalPauseTime = now - pauseStartTime;
                    nextFuelTime += totalPauseTime;
                    nextCanisterTime += totalPauseTime;
                    nextCoinTime += totalPauseTime;
                    nextSpikeTime += totalPauseTime;
                    scoreTimer += totalPauseTime;
                    gameState = 'PLAYING';
                    lastGameTimeUpdate = now;
                }
            }

            if (gameState === 'PLAYING') {
                if (healthShakeTimer > 0) {
                    healthShakeTimer -= 16;
                }

                if (now - scoreTimer >= SCORE_INTERVAL) {
                    let bonusMultiplier = 1;
                    if (isGoldSkin()) bonusMultiplier = 2;
                    const totalBonus = bonusMultiplier + goldScoreBonus;
                    score += totalBonus;
                    scoreTimer = now;
                }

                if (now >= nextFuelTime) {
                    fuel--;
                    hasBonusTime = false;
                    nextFuelTime = now + 3000;
                    if (fuel <= 0) { 
                        fuel = 0; 
                        gameState = 'GAMEOVER';
                        if (score > bestScore) {
                            bestScore = score;
                            saveBestScore();
                        }
                        updateStats(coinsCollected, canistersCollected, score);
                        saveStats();
                        saveGameTime();
                        if (currentUser) saveUserProgress();
                    }
                }

                if (now >= nextCanisterTime) {
                    const canisterSize = Math.max(36, rocket.height * 0.45);
                    canisters.push({
                        x: canvas.width + 50,
                        y: Math.random() * (canvas.height - canisterSize - 140) + 70,
                        size: canisterSize,
                        angle: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1)
                    });
                    nextCanisterTime = now + Math.random() * 4000 + 4000;
                }

                if (now >= nextCoinTime) {
                    const coinSize = Math.max(36, rocket.height * 0.45);
                    const isExtra = Math.random() < 0.2;
                    gameCoinsList.push({
                        x: canvas.width + 50,
                        y: Math.random() * (canvas.height - coinSize - 140) + 70,
                        size: coinSize,
                        angle: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
                        isExtra: isExtra,
                        value: isExtra ? 5 : 1
                    });
                    nextCoinTime = now + Math.random() * 7000 + 8000;
                }

                if (now >= nextSpikeTime) {
                    const spikeSize = Math.max(30, rocket.height * 0.4);
                    const x = canvas.width + spikeSize;
                    const y = Math.random() * (canvas.height - spikeSize - 100) + 50;
                    
                    spikes.push({
                        x: x,
                        y: y,
                        size: spikeSize,
                        targetX: rocket.x + rocket.width / 2,
                        targetY: rocket.y + rocket.height / 2,
                        state: 'chasing',
                        speed: 1.8 + Math.random() * 0.8,
                        angle: 0
                    });
                    
                    nextSpikeTime = now + Math.random() * 8000 + 6000;
                }

                for (let i = spikes.length - 1; i >= 0; i--) {
                    const spike = spikes[i];
                    
                    const targetX = rocket.x + rocket.width / 2;
                    const targetY = rocket.y + rocket.height / 2;
                    const dx = targetX - spike.x;
                    const dy = targetY - spike.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (spike.state === 'chasing') {
                        if (dist > 0) {
                            const speed = spike.speed;
                            spike.x += (dx / dist) * speed;
                            spike.y += (dy / dist) * speed;
                            spike.angle = Math.atan2(dy, dx);
                        }
                        
                        if (dist < 200) {
                            spike.state = 'flying';
                            spike.dirX = dx / dist;
                            spike.dirY = dy / dist;
                        }
                    } else if (spike.state === 'flying') {
                        spike.x += spike.dirX * spike.speed * 1.1;
                        spike.y += spike.dirY * spike.speed * 1.1;
                    }
                    
                    const margin = 8;
                    if (rocket.x < spike.x + spike.size - margin && rocket.x + rocket.width > spike.x + margin &&
                        rocket.y < spike.y + spike.size - margin && rocket.y + rocket.height > spike.y + margin) {
                        
                        if ((isGloveSkin() || isAppleSkin()) && Math.random() < 0.3) {
                            playStoneBrake();
                            for (let p = 0; p < 12; p++) {
                                spikeParticles.push({
                                    x: spike.x + spike.size / 2,
                                    y: spike.y + spike.size / 2,
                                    vx: (Math.random() - 0.5) * 6,
                                    vy: (Math.random() - 0.5) * 6 - 2,
                                    size: Math.random() * 6 + 3,
                                    life: 60 + Math.random() * 30,
                                    maxLife: 90,
                                    color: `hsl(${40 + Math.random() * 30}, 70%, ${50 + Math.random() * 30}%)`
                                });
                            }
                            spikes.splice(i, 1);
                            continue;
                        }
                        
                        if (currentHealth > 0) {
                            takeDamage();
                        }
                        spikes.splice(i, 1);
                        continue;
                    }
                    
                    if (spike.x < -spike.size - 100 || spike.x > canvas.width + spike.size + 100 ||
                        spike.y < -spike.size - 100 || spike.y > canvas.height + spike.size + 100) {
                        spikes.splice(i, 1);
                    }
                }

                for (let i = spikeParticles.length - 1; i >= 0; i--) {
                    const p = spikeParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    p.life--;
                    if (p.life <= 0) {
                        spikeParticles.splice(i, 1);
                    }
                }

                for (let i = canisters.length - 1; i >= 0; i--) {
                    let c = canisters[i];
                    c.x -= 4.5;
                    c.angle += c.rotationSpeed;

                    if (rocket.x < c.x + c.size && rocket.x + rocket.width > c.x &&
                        rocket.y < c.y + c.size && rocket.y + rocket.height > c.y) {
                        fuel += 2;
                        canistersCollected++;
                        if (!hasBonusTime) { nextFuelTime += 4000; hasBonusTime = true; }
                        if (isGoldSkin()) {
                            goldScoreBonus++;
                            saveGoldBonus();
                        }
                        if (isBrokenSkin()) {
                            brokenExtraBonus++;
                            saveBrokenBonus();
                        }
                        canisters.splice(i, 1);
                        continue;
                    }
                    if (c.x < -c.size - 50) canisters.splice(i, 1);
                }

                for (let i = gameCoinsList.length - 1; i >= 0; i--) {
                    let coinObj = gameCoinsList[i];
                    coinObj.x -= 4.5;
                    coinObj.angle += coinObj.rotationSpeed;

                    if (rocket.x < coinObj.x + coinObj.size && rocket.x + rocket.width > coinObj.x &&
                        rocket.y < coinObj.y + coinObj.size && rocket.y + rocket.height > coinObj.y) {
                        const isInvUpgradeActive = Date.now() < inventoryUpgradeExpireTime;
                        let multiplier = isInvUpgradeActive ? 2 : 1;
                        if (isBrokenSkin()) {
                            multiplier += 2;
                        }
                        if (isBrokenSkin() && coinObj.isExtra) {
                            brokenExtraBonus++;
                            saveBrokenBonus();
                        }
                        const earned = coinObj.value * multiplier;
                        coins += earned;
                        coinsCollected += earned;
                        saveCoins();
                        gameCoinsList.splice(i, 1);
                        continue;
                    }
                    if (coinObj.x < -coinObj.size - 50) gameCoinsList.splice(i, 1);
                }

                rocket.velocity += rocket.gravity;
                rocket.y += rocket.velocity;

                const targetAngle = (rocket.velocity < 0) ? -0.35 : 0.25;
                rocket.angle += (targetAngle - rocket.angle) * 0.15;

                const ceilingLimit = -rocket.height * 0.3;
                if (rocket.y < ceilingLimit) { rocket.y = ceilingLimit; rocket.velocity = 0; }
                
                if (rocket.y >= canvas.height) {
                    if (isCherrySkin() && !cherryTeleportUsed) {
                        cherryTeleportUsed = true;
                        saveHealth();
                        rocket.y = canvas.height / 2 - rocket.height / 2;
                        rocket.velocity = 0;
                        healthShakeTimer = 200;
                        rocket.velocity = rocket.lift * 0.3;
                    } else {
                        gameState = 'GAMEOVER';
                        if (score > bestScore) {
                            bestScore = score;
                            saveBestScore();
                        }
                        updateStats(coinsCollected, canistersCollected, score);
                        saveStats();
                        saveGameTime();
                        if (currentUser) saveUserProgress();
                    }
                }
            }
            
            if (gameState === 'SKINS_SHOP') {
                updateGacha();
            }
            
            rainbowTime += 0.02;
        }

        function drawRotatedImage(img, x, y, width, height, angle) {
            if (!img) return;
            ctx.save();
            ctx.translate(x + width / 2, y + height / 2);
            ctx.rotate(angle);
            ctx.drawImage(img, -width / 2, -height / 2, width, height);
            ctx.restore();
        }

        function drawRainbowGlow(x, y, width, height) {
            const gradient = ctx.createRadialGradient(
                x + width / 2, y + height / 2, 0,
                x + width / 2, y + height / 2, width * 0.8
            );
            
            const hue1 = (rainbowTime * 180) % 360;
            const hue2 = (rainbowTime * 180 + 60) % 360;
            const hue3 = (rainbowTime * 180 + 120) % 360;
            const hue4 = (rainbowTime * 180 + 180) % 360;
            const hue5 = (rainbowTime * 180 + 240) % 360;
            const hue6 = (rainbowTime * 180 + 300) % 360;
            
            gradient.addColorStop(0, `hsla(${hue1}, 100%, 70%, 0.4)`);
            gradient.addColorStop(0.2, `hsla(${hue2}, 100%, 65%, 0.3)`);
            gradient.addColorStop(0.4, `hsla(${hue3}, 100%, 60%, 0.25)`);
            gradient.addColorStop(0.6, `hsla(${hue4}, 100%, 55%, 0.2)`);
            gradient.addColorStop(0.8, `hsla(${hue5}, 100%, 50%, 0.15)`);
            gradient.addColorStop(1, `hsla(${hue6}, 100%, 45%, 0)`);
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x + width / 2, y + height / 2, width * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }

            }

            ctx.font = `bold ${fontSize * 0.9}px monospace`;

            ctx.font = `${fontSize * 0.7}px Arial`;

                ctx.fillText('⭐+' + goldScoreBonus, startX, bonusY);

                ctx.fillText('💔+' + brokenExtraBonus, startX, bonusY);

                ctx.fillStyle = 'rgba(100,200,255,0.4)';
                ctx.font = `${fontSize * 0.5}px Arial`;
                let bonusText = '';
                if (isClassSkin()) bonusText += '🎓 +' + classExtraScore + 'pts';
                if (isBotanSkin()) bonusText += ' 🌿 +' + botanExtraScore + 'pts';
                ctx.fillText(bonusText, startX, bonusY);

            if (isCherrySkin() && gameState === 'PLAYING') {
                ctx.fillStyle = 'rgba(255,100,200,0.4)';
                ctx.font = `${fontSize * 0.5}px Arial`;
                ctx.fillText('🍒 ' + (cherryTeleportUsed ? 'использован' : 'готов'), startX, bonusY);
            }
            if (isGloveSkin() || isAppleSkin()) {
                ctx.fillStyle = 'rgba(100,200,100,0.4)';
                ctx.font = `${fontSize * 0.5}px Arial`;
                ctx.fillText('🧤 30% break', startX, bonusY);

            if (currentUser) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${Math.max(10, fontSize * 0.4)}px Arial`;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('||', pauseBtn.x + pauseBtn.size / 2, pauseBtn.y + pauseBtn.size / 2 + 1);
            }
        }

        function drawStatus() {
            const fontSizeTitle = Math.max(20, Math.min(canvas.width * 0.055, 30));
            const fontSize = Math.max(14, Math.min(canvas.width * 0.035, 20));
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(20, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(t('coins', coins), canvas.width / 2, Math.max(16, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText(t('status_title'), canvas.width / 2, canvas.height * 0.18);

            const startX = canvas.width * 0.06;
            let startY = canvas.height * 0.26 - statusScrollOffset;
            const lineHeight = fontSize * 1.3;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, canvas.height * 0.20, canvas.width, canvas.height * 0.65);
            ctx.clip();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = `${fontSize}px Arial`;

            const stats = [
                t('status_total_coins', playerStats.totalCoins || 0),
                t('status_total_canisters', playerStats.totalCanisters || 0),
                t('status_total_hours', totalGameTime ? formatTime(Math.floor(totalGameTime)) : '0s'),
                t('status_total_skins', playerStats.totalSkins || 0),
                t('status_total_upgrades', playerStats.totalUpgrades || 0),
                t('status_total_score', playerStats.totalScore || 0),
                '',
                t('status_coins', coins || 0),
                t('status_canisters', fuel || 0),
                t('status_score', score || bestScore || 0),
                '',
                t('status_skins_list')
            ];

            const skinList = [];
            const skinOrder = ['DEFAULT', 'CARTOON', 'RAINBOW', 'NYAN', 'PENCIL', 'GOLD', 'BROKEN', 'CLASS', 'GLOVE', 'BOTAN', 'ORANGE', 'CHERRY', 'APPLE'];
            for (let key of skinOrder) {
                const skin = SKINS[key];
                if (!skin) continue;
                let name = t(skin.nameKey);
                let emoji = '';
                if (key === 'DEFAULT') emoji = '';
                else if (key === 'RAINBOW') emoji = '🌈 ';
                else if (key === 'NYAN') emoji = '🐱 ';
                else if (key === 'PENCIL') emoji = '✏️ ';
                else if (key === 'GOLD') emoji = '⭐ ';
                else if (key === 'BROKEN') emoji = '💔 ';
                else if (key === 'CLASS') emoji = '🎓 ';
                else if (key === 'GLOVE') emoji = '🧤 ';
                else if (key === 'BOTAN') emoji = '🌿 ';
                else if (key === 'ORANGE') emoji = '🍊 ';
                else if (key === 'CHERRY') emoji = '🍒 ';
                else if (key === 'APPLE') emoji = '🍎 ';
                const feature = getSkinFeature(skin.id);
                const purchased = skin.purchased ? '✅' : '❌';
                skinList.push(`${purchased} ${emoji}${name} - ${feature}`);
            }

            let yPos = startY;
            for (let i = 0; i < stats.length; i++) {
                if (stats[i] === '') {
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(startX, yPos + lineHeight * 0.3);
                    ctx.lineTo(canvas.width - startX, yPos + lineHeight * 0.3);
                    ctx.stroke();
                    yPos += lineHeight;
                    continue;
                }
                
                if (i >= stats.length - 4 && i < stats.length - 1) {
                    ctx.fillStyle = 'rgba(255,215,0,0.7)';
                } else if (i === stats.length - 1) {
                    ctx.fillStyle = 'rgba(255,215,0,0.8)';
                    ctx.font = `bold ${fontSize}px Arial`;
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = `${fontSize}px Arial`;
                }
                ctx.fillText(stats[i], startX, yPos);
                yPos += lineHeight;
            }

            const skinFontSize = Math.max(11, Math.min(canvas.width * 0.028, 16));
            ctx.font = `${skinFontSize}px Arial`;
            let skinY = yPos;
            const finalLineHeight = skinFontSize * 1.2;
            
            for (let i = 0; i < skinList.length; i++) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(skinList[i], startX, skinY);
                skinY += finalLineHeight;
            }

            // Список прокачек
            if (skinY + 40 < canvas.height) {
                ctx.fillStyle = 'rgba(255,215,0,0.8)';
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillText(t('status_upgrades_list'), startX, skinY + 10);
                skinY += fontSize * 1.5;

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = `${fontSize * 0.9}px Arial`;
                const upgrades = [
                    t('upgrade_tank') + (fuelUpgradeExpireTime > Date.now() ? ' ✅' : ' ❌'),
                    t('upgrade_inv') + (inventoryUpgradeExpireTime > Date.now() ? ' ✅' : ' ❌'),
                    t('upgrade_hull') + (hullUpgradeExpireTime > Date.now() ? ' ✅' : ' ❌'),
                    t('upgrade_engine') + (engineUpgradeExpireTime > Date.now() ? ' ✅ (ур. ' + engineUpgradeLevel + ')' : ' ❌')
                ];
                for (let upg of upgrades) {
                    ctx.fillText(upg, startX, skinY);
                    skinY += fontSize * 1.1;
                }
            }

            ctx.restore();

            // Индикатор скролла
            if (statusNeedsScroll && statusMaxScroll > 0) {
                const scrollBarHeight = Math.max(20, (canvas.height * 0.65) * (canvas.height * 0.65 / (canvas.height * 0.65 + statusMaxScroll)));
                const scrollBarY = canvas.height * 0.20 + ((canvas.height * 0.65 - scrollBarHeight) * (statusScrollOffset / statusMaxScroll));
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.roundRect(canvas.width - 6, canvas.height * 0.20, 4, canvas.height * 0.65, 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.roundRect(canvas.width - 6, scrollBarY, 4, scrollBarHeight, 2);
                ctx.fill();
            }

            drawButtons(statusButtons);
        }

            ctx.textAlign = 'center';
