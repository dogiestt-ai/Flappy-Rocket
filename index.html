<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050510">

    <title>Flappy Rocket Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            touch-action: none;
            position: fixed;
        }

        #gameContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            aspect-ratio: 9 / 16;
            background-color: #0a0a1a;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        @media (min-aspect-ratio: 1/1) {
            canvas {
                max-height: 100vh;
                max-width: calc(100vh * 9 / 16);
                width: auto;
                height: 100vh;
            }
        }

        @media (max-aspect-ratio: 1/1) {
            canvas {
                max-width: 100vw;
                max-height: calc(100vw * 16 / 9);
                width: 100vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        window.history.pushState({ page: 1 }, "", "");

        function closeTab() {
            window.close();
            document.body.innerHTML = "<div style='color:white; font-family:Arial; text-align:center; margin-top:30%; font-size:22px;'>Session ended.</div>";
        }

        window.addEventListener('popstate', function () {
            closeTab();
        });

        // --- Сохранение и загрузка данных ---
        let coins = parseInt(localStorage.getItem('flappy_rocket_coins')) || 0;
        let fuelUpgradeExpireTime = parseInt(localStorage.getItem('flappy_rocket_fuel_expire')) || 0;
        let inventoryUpgradeExpireTime = parseInt(localStorage.getItem('flappy_rocket_inv_expire')) || 0;
        let inventoryUpgradePrice = parseInt(localStorage.getItem('flappy_rocket_inv_price')) || 5;

        // Система скинов
        const SKINS = {
            DEFAULT: { id: 'default', name: 'Обычная', price: 0, imgIdle: 'Raketa-1.png', imgFly: 'Rakera-2.png', purchased: true },
            CARTOON: { id: 'cartoon', name: 'Мультяшная Ракета', price: 5, imgIdle: 'Mult-Raketa-1.png', imgFly: 'Mult-Raketa-2.png', purchased: false },
            RAINBOW: { id: 'rainbow', name: 'Радужная Ракета', price: 10, imgIdle: 'Rainbow-Roc-1.png', imgFly: 'Rainbow-Roc-2.png', purchased: false }
        };

        let currentSkin = localStorage.getItem('flappy_rocket_skin') || 'default';
        let skinImages = {};

        let parsedSkins;
        try {
            parsedSkins = JSON.parse(localStorage.getItem('flappy_rocket_purchased_skins'));
        } catch (e) {
            parsedSkins = null;
        }
        
        let purchasedSkins = Array.isArray(parsedSkins) ? parsedSkins : ['default'];
        
        if (!purchasedSkins.includes('default')) {
            purchasedSkins.push('default');
        }

        purchasedSkins.forEach(skinId => {
            const matchedKey = Object.keys(SKINS).find(k => SKINS[k].id === skinId || k.toLowerCase() === skinId.toLowerCase());
            if (matchedKey) {
                SKINS[matchedKey].purchased = true;
            }
        });

        function saveSkinData() {
            localStorage.setItem('flappy_rocket_skin', currentSkin);
            localStorage.setItem('flappy_rocket_purchased_skins', JSON.stringify(purchasedSkins));
        }

        function saveCoins() { localStorage.setItem('flappy_rocket_coins', coins); }
        function saveUpgradeExpire() { localStorage.setItem('flappy_rocket_fuel_expire', fuelUpgradeExpireTime); }
        function saveInventoryUpgrade() {
            localStorage.setItem('flappy_rocket_inv_expire', inventoryUpgradeExpireTime);
            localStorage.setItem('flappy_rocket_inv_price', inventoryUpgradePrice);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyL' || e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') {
                coins += 100;
                saveCoins();
            }
        });

        function loadSkinImages() {
            for (let skinId in SKINS) {
                const skin = SKINS[skinId];
                if (!skinImages[skinId]) {
                    skinImages[skinId] = {
                        idle: new Image(),
                        fly: new Image()
                    };
                }
                skinImages[skinId].idle.src = skin.imgIdle;
                skinImages[skinId].fly.src = skin.imgFly;
            }
        }
        loadSkinImages();

        const imgFuel = new Image(); imgFuel.src = 'Toplivo.png';
        const imgCoin = new Image(); imgCoin.src = 'Coin.png';
        const imgExstraCoin = new Image(); imgExstraCoin.src = 'Exstra-Coin.png';

        const imgIdle = new Image(); imgIdle.src = 'Raketa-1.png';
        const imgFly = new Image(); imgFly.src = 'Rakera-2.png';

        const rocket = {
            x: 0, y: 0, width: 0, height: 0,
            velocity: 0, gravity: 0.5, lift: -9, angle: 0
        };

        const menuRocket = { x: -600, y: 0, width: 0, height: 0, time: 0 };

        let gameState = 'MAIN_MENU';
        let safeTop = 0;
        let safeLeft = 0;

        let pauseBtn = { x: 0, y: 0, size: 55 };
        let pauseMenuButtons = [];
        let shopButtons = [];
        let menuButtons = [];
        let skinsMenuButtons = [];
        let skinsShopButtons = [];

        let pauseStartTime = 0;
        let unpauseEndTime = 0;
        let menuBlockEndTime = 0;
        let touchLockEndTime = 0;

        let fuel = 5;
        let nextFuelTime = 0;
        let hasBonusTime = false;
        let canisters = [];
        let nextCanisterTime = 0;

        let gameCoinsList = [];
        let nextCoinTime = 0;

        let stars = [];
        const STAR_COUNT = 100;

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }

        function updateMenuButtons() {
            const btnWidth = Math.min(canvas.width * 0.35, 200);
            const btnHeight = Math.max(38, Math.min(canvas.height * 0.065, 46));
            const startY = canvas.height * 0.48;
            const spacing = btnHeight * 0.3;

            menuButtons = [
                { id: 'PLAY', text: 'ИГРАТЬ', x: canvas.width * 0.05, y: startY, w: btnWidth, h: btnHeight },
                { id: 'SHOP', text: 'МАГАЗИН', x: canvas.width - canvas.width * 0.05 - btnWidth, y: startY, w: btnWidth, h: btnHeight },
                { id: 'SKINS', text: 'СКИНЫ', x: canvas.width * 0.05, y: startY + btnHeight + spacing, w: btnWidth, h: btnHeight }
            ];

            pauseMenuButtons = [
                { id: 'RESUME', text: 'ПРОДОЛЖИТЬ', x: canvas.width / 2 - btnWidth / 2, y: startY, w: btnWidth, h: btnHeight },
                { id: 'TO_MENU', text: 'В МЕНЮ', x: canvas.width / 2 - btnWidth / 2, y: startY + btnHeight + spacing, w: btnWidth, h: btnHeight }
            ];

            // Магазин улучшений: кнопки ДАЛЕЕ и НАЗАД аккуратно размещены друг над другом у самого низа экрана с безопасным отступом
            const bottomMargin = 20;
            const backY = canvas.height - btnHeight - bottomMargin;
            const nextY = backY - btnHeight - 12; // 12 пикселей промежутка между ДАЛЕЕ и НАЗАД, чтобы они не слипались

            shopButtons = [
                { id: 'BUY_TANK', text: 'ОБНОВИТЬ БАК (10)', x: canvas.width / 2 - btnWidth / 2, y: canvas.height * 0.38, w: btnWidth, h: btnHeight },
                { id: 'BUY_INV', text: `УЛУЧШИТЬ ИНВЕНТАРЬ (${inventoryUpgradePrice})`, x: canvas.width / 2 - btnWidth / 2, y: canvas.height * 0.38 + btnHeight + spacing, w: btnWidth, h: btnHeight },
                { id: 'NEXT', text: 'ДАЛЕЕ', x: canvas.width / 2 - btnWidth / 2, y: nextY, w: btnWidth, h: btnHeight },
                { id: 'BACK', text: 'НАЗАД', x: canvas.width / 2 - btnWidth / 2, y: backY, w: btnWidth, h: btnHeight }
            ];

            skinsMenuButtons = [
                { id: 'BACK', text: 'НАЗАД', x: canvas.width * 0.05, y: canvas.height * 0.85, w: btnWidth, h: btnHeight }
            ];

            const btnSize = Math.max(52, Math.min(canvas.width * 0.14, 65));
            pauseBtn = {
                x: canvas.width - safeLeft - btnSize - 15,
                y: safeTop + 15,
                size: btnSize
            };
        }

        function updateSkinsShopButtons() {
            const btnWidth = Math.min(canvas.width * 0.7, 250);
            const btnHeight = Math.max(40, Math.min(canvas.height * 0.07, 50));
            const bottomMargin = 20;
            
            // Кнопка НАЗАД в магазине скинов закреплена у самого низа
            skinsShopButtons = [
                {
                    id: 'BACK',
                    text: 'НАЗАД',
                    x: canvas.width / 2 - btnWidth / 2,
                    y: canvas.height - btnHeight - bottomMargin,
                    w: btnWidth,
                    h: btnHeight
                }
            ];
        }

        function resize() {
            const aspectRatio = 9 / 16;
            let width = window.innerWidth;
            let height = window.innerHeight;

            if (width / height > aspectRatio) {
                canvas.height = height;
                canvas.width = height * aspectRatio;
            } else {
                canvas.width = width;
                canvas.height = width / aspectRatio;
            }

            canvas.style.position = 'absolute';
            canvas.style.left = (window.innerWidth - canvas.width) / 2 + 'px';
            canvas.style.top = (window.innerHeight - canvas.height) / 2 + 'px';

            safeTop = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 10;
            safeLeft = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-left')) || 10;

            const baseSize = Math.min(canvas.width * 0.65, canvas.height * 0.42);
            rocket.width = Math.max(170, Math.min(baseSize, 340));
            rocket.height = rocket.width * 0.66;

            menuRocket.width = rocket.width * 2.3;
            menuRocket.height = menuRocket.width * 0.66;

            if (gameState === 'WAITING_TO_START' || gameState === 'MAIN_MENU') {
                rocket.x = canvas.width * 0.08;
                rocket.y = canvas.height / 2 - rocket.height / 2;
            }

            updateMenuButtons();
            updateSkinsShopButtons();
            initStars();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 100));

        function getCurrentSkinImages() {
            const skin = SKINS[currentSkin.toUpperCase()] || SKINS.DEFAULT;
            if (skin && skinImages[skin.id]) {
                return skinImages[skin.id];
            }
            return { idle: imgIdle, fly: imgFly };
        }

        function handlePressStart(e) {
            if (Date.now() < touchLockEndTime) return;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const canvasX = clientX - rect.left;
            const canvasY = clientY - rect.top;

            if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return;

            if (gameState === 'MAIN_MENU') {
                if (Date.now() < menuBlockEndTime) return;

                for (let btn of menuButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        if (btn.id === 'PLAY') prepareGameWaiting();
                        else if (btn.id === 'SHOP') {
                            gameState = 'SHOP';
                            touchLockEndTime = Date.now() + 300;
                        } else if (btn.id === 'SKINS') {
                            gameState = 'SKINS';
                            touchLockEndTime = Date.now() + 300;
                            updateSkinsShopButtons();
                        }
                        break;
                    }
                }
            }
            else if (gameState === 'SHOP') {
                for (let btn of shopButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        const now = Date.now();
                        if (btn.id === 'BUY_TANK') {
                            if (now > fuelUpgradeExpireTime && coins >= 10) {
                                coins -= 10;
                                saveCoins();
                                fuelUpgradeExpireTime = now + 10 * 60 * 1000;
                                saveUpgradeExpire();
                                updateMenuButtons();
                            }
                        } else if (btn.id === 'BUY_INV') {
                            if (now > inventoryUpgradeExpireTime && coins >= inventoryUpgradePrice) {
                                coins -= inventoryUpgradePrice;
                                saveCoins();
                                inventoryUpgradeExpireTime = now + 10 * 60 * 1000;
                                inventoryUpgradePrice += 3;
                                saveInventoryUpgrade();
                                updateMenuButtons();
                            }
                        } else if (btn.id === 'NEXT') {
                            gameState = 'SKINS_SHOP';
                            touchLockEndTime = Date.now() + 300;
                            updateSkinsShopButtons();
                        } else if (btn.id === 'BACK') {
                            gameState = 'MAIN_MENU';
                            touchLockEndTime = Date.now() + 300;
                        }
                        break;
                    }
                }
            }
            else if (gameState === 'SKINS') {
                for (let btn of skinsMenuButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        if (btn.id === 'BACK') {
                            gameState = 'MAIN_MENU';
                            touchLockEndTime = Date.now() + 300;
                        }
                        break;
                    }
                }
                
                const skinY = canvas.height * 0.42;
                const btnWidth = Math.min(canvas.width * 0.7, 250);
                const btnHeight = Math.max(40, Math.min(canvas.height * 0.07, 50));
                const spacing = btnHeight * 0.3;
                
                let yPos = skinY;
                for (let skinId in SKINS) {
                    const skin = SKINS[skinId];
                    if (skin.purchased) {
                        const btnX = canvas.width / 2 - btnWidth / 2;
                        if (canvasX >= btnX && canvasX <= btnX + btnWidth &&
                            canvasY >= yPos && canvasY <= yPos + btnHeight) {
                            currentSkin = skin.id;
                            saveSkinData();
                            updateMenuButtons();
                            break;
                        }
                    }
                    yPos += btnHeight + spacing;
                }
            }
            else if (gameState === 'SKINS_SHOP') {
                for (let btn of skinsShopButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        if (btn.id === 'BACK') {
                            gameState = 'SHOP';
                            touchLockEndTime = Date.now() + 300;
                            break;
                        }
                        break;
                    }
                }

                const skinShopStartY = canvas.height * 0.38;
                const btnWidth = Math.min(canvas.width * 0.7, 250);
                const btnHeight = Math.max(40, Math.min(canvas.height * 0.07, 50));
                const spacing = btnHeight * 0.3;
                
                let skinIndex = 0;
                for (let skinId in SKINS) {
                    const skin = SKINS[skinId];
                    if (skinId === 'DEFAULT') continue;

                    if (!skin.purchased) {
                        const yPos = skinShopStartY + skinIndex * (btnHeight + spacing);
                        const btnX = canvas.width / 2 - btnWidth / 2;
                        if (canvasX >= btnX && canvasX <= btnX + btnWidth &&
                            canvasY >= yPos && canvasY <= yPos + btnHeight) {
                            if (coins >= skin.price) {
                                coins -= skin.price;
                                saveCoins();
                                skin.purchased = true;
                                if (!purchasedSkins.includes(skin.id)) {
                                    purchasedSkins.push(skin.id);
                                }
                                currentSkin = skin.id;
                                saveSkinData();
                                updateSkinsShopButtons();
                                updateMenuButtons();
                            }
                            break;
                        }
                        skinIndex++;
                    }
                }
            }
            else if (gameState === 'PLAYING') {
                if (canvasX >= pauseBtn.x && canvasX <= pauseBtn.x + pauseBtn.size &&
                    canvasY >= pauseBtn.y && canvasY <= pauseBtn.y + pauseBtn.size) {
                    gameState = 'PAUSED';
                    pauseStartTime = Date.now();
                    return;
                }
                rocket.velocity = rocket.lift;
            }
            else if (gameState === 'PAUSED') {
                for (let btn of pauseMenuButtons) {
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        if (btn.id === 'RESUME') {
                            gameState = 'UNPAUSING';
                            unpauseEndTime = Date.now() + 2000;
                            rocket.velocity = 0;
                        } else if (btn.id === 'TO_MENU') {
                            gameState = 'MAIN_MENU';
                            menuBlockEndTime = Date.now() + 1000;
                        }
                        break;
                    }
                }
            }
            else if (gameState === 'WAITING_TO_START') startPlaying();
            else if (gameState === 'GAMEOVER') prepareGameWaiting();
        }

        window.addEventListener('mousedown', handlePressStart);
        window.addEventListener('touchstart', handlePressStart, { passive: false });

        function prepareGameWaiting() {
            rocket.x = canvas.width * 0.08;
            rocket.y = canvas.height / 2 - rocket.height / 2;
            rocket.velocity = 0;
            rocket.angle = 0;

            const isUpgradeActive = Date.now() < fuelUpgradeExpireTime;
            fuel = isUpgradeActive ? 10 : 5;

            hasBonusTime = false;
            canisters = [];
            gameCoinsList = [];
            gameState = 'WAITING_TO_START';
        }

        function startPlaying() {
            nextFuelTime = Date.now() + 3000;
            nextCanisterTime = Date.now() + Math.random() * 4000 + 4000;
            nextCoinTime = Date.now() + Math.random() * 7000 + 8000;
            rocket.velocity = rocket.lift;
            gameState = 'PLAYING';
        }

        function update() {
            if (gameState !== 'WAITING_TO_START' && gameState !== 'PAUSED' && gameState !== 'UNPAUSING') {
                for (let star of stars) {
                    star.x -= star.speed * 1.5;
                    if (star.x < 0) {
                        star.x = canvas.width + Math.random() * 20;
                        star.y = Math.random() * canvas.height;
                    }
                }
            }

            if (gameState === 'MAIN_MENU' || gameState === 'SHOP' || gameState === 'SKINS' || gameState === 'SKINS_SHOP') {
                menuRocket.time += 0.05;
                menuRocket.x += 6.5;
                menuRocket.y = (canvas.height * 0.22) + Math.sin(menuRocket.time) * 25;

                if (menuRocket.x > canvas.width + menuRocket.width + 50) {
                    menuRocket.x = -menuRocket.width - 100;
                }
            }

            if (gameState === 'UNPAUSING') {
                const now = Date.now();
                if (now >= unpauseEndTime) {
                    const totalPauseTime = now - pauseStartTime;
                    nextFuelTime += totalPauseTime;
                    nextCanisterTime += totalPauseTime;
                    nextCoinTime += totalPauseTime;
                    gameState = 'PLAYING';
                }
            }

            if (gameState === 'PLAYING') {
                const now = Date.now();

                if (now >= nextFuelTime) {
                    fuel--;
                    hasBonusTime = false;
                    nextFuelTime = now + 3000;
                    if (fuel <= 0) { fuel = 0; gameState = 'GAMEOVER'; }
                }

                if (now >= nextCanisterTime) {
                    const canisterSize = Math.max(36, rocket.height * 0.32);
                    canisters.push({
                        x: canvas.width + 50,
                        y: Math.random() * (canvas.height - canisterSize - 140) + 70,
                        size: canisterSize,
                        angle: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1)
                    });
                    nextCanisterTime = now + Math.random() * 4000 + 4000;
                }

                if (now >= nextCoinTime) {
                    const coinSize = Math.max(36, rocket.height * 0.32);
                    const isExtra = Math.random() < 0.2;
                    gameCoinsList.push({
                        x: canvas.width + 50,
                        y: Math.random() * (canvas.height - coinSize - 140) + 70,
                        size: coinSize,
                        angle: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
                        isExtra: isExtra,
                        value: isExtra ? 5 : 1
                    });
                    nextCoinTime = now + Math.random() * 7000 + 8000;
                }

                for (let i = canisters.length - 1; i >= 0; i--) {
                    let c = canisters[i];
                    c.x -= 4.5;
                    c.angle += c.rotationSpeed;

                    if (rocket.x < c.x + c.size && rocket.x + rocket.width > c.x &&
                        rocket.y < c.y + c.size && rocket.y + rocket.height > c.y) {
                        fuel += 2;
                        if (!hasBonusTime) { nextFuelTime += 4000; hasBonusTime = true; }
                        canisters.splice(i, 1);
                        continue;
                    }
                    if (c.x < -c.size - 50) canisters.splice(i, 1);
                }

                for (let i = gameCoinsList.length - 1; i >= 0; i--) {
                    let coinObj = gameCoinsList[i];
                    coinObj.x -= 4.5;
                    coinObj.angle += coinObj.rotationSpeed;

                    if (rocket.x < coinObj.x + coinObj.size && rocket.x + rocket.width > coinObj.x &&
                        rocket.y < coinObj.y + coinObj.size && rocket.y + rocket.height > coinObj.y) {
                        const isInvUpgradeActive = Date.now() < inventoryUpgradeExpireTime;
                        const multiplier = isInvUpgradeActive ? 2 : 1;
                        coins += coinObj.value * multiplier;
                        saveCoins();
                        gameCoinsList.splice(i, 1);
                        continue;
                    }
                    if (coinObj.x < -coinObj.size - 50) gameCoinsList.splice(i, 1);
                }

                rocket.velocity += rocket.gravity;
                rocket.y += rocket.velocity;

                const targetAngle = (rocket.velocity < 0) ? -0.35 : 0.25;
                rocket.angle += (targetAngle - rocket.angle) * 0.15;

                const ceilingLimit = -rocket.height * 0.3;
                if (rocket.y < ceilingLimit) { rocket.y = ceilingLimit; rocket.velocity = 0; }
                if (rocket.y >= canvas.height) gameState = 'GAMEOVER';
            }
        }

        function drawRotatedImage(img, x, y, width, height, angle) {
            ctx.save();
            ctx.translate(x + width / 2, y + height / 2);
            ctx.rotate(angle);
            ctx.drawImage(img, -width / 2, -height / 2, width, height);
            ctx.restore();
        }

        function drawUI() {
            const fontSize = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';

            const startX = Math.max(16, safeLeft + 12);
            const startY = Math.max(16, safeTop + 12);

            ctx.fillText(`Fuel: ${fuel}`, startX, startY);
            ctx.fillText(`Coins: ${coins}`, startX, startY + fontSize * 1.35);

            if (gameState === 'PLAYING') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
                ctx.beginPath();
                ctx.roundRect(pauseBtn.x, pauseBtn.y, pauseBtn.size, pauseBtn.size, 14);
                ctx.fill();

                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `${pauseBtn.size * 0.52}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('||', pauseBtn.x + pauseBtn.size / 2, pauseBtn.y + pauseBtn.size / 2 + 1);
            }
        }

        function drawMainMenu() {
            const fontSizeTitle = Math.max(24, Math.min(canvas.width * 0.075, 38));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`Coins: ${coins}`, canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText('FLAPPY ROCKET', canvas.width / 2, canvas.height * 0.36);

            const activeSkinObj = SKINS[currentSkin.toUpperCase()] || SKINS.DEFAULT;
            ctx.font = `${Math.max(14, fontSizeTitle * 0.4)}px Arial`;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillText(`Skin: ${activeSkinObj.name}`, canvas.width / 2, canvas.height * 0.42);

            const isBlocked = Date.now() < menuBlockEndTime;
            for (let btn of menuButtons) {
                drawSingleButton(btn, btn.text, isBlocked);
            }
        }

        function drawShop() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`Coins: ${coins}`, canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText('SHOP', canvas.width / 2, canvas.height * 0.28);

            const now = Date.now();

            for (let btn of shopButtons) {
                let text = btn.text;
                let disabled = false;

                if (btn.id === 'BUY_TANK') {
                    if (now < fuelUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((fuelUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = `TANK (${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')})`;
                    } else if (coins < 10) disabled = true;
                }
                else if (btn.id === 'BUY_INV') {
                    if (now < inventoryUpgradeExpireTime) {
                        disabled = true;
                        const remainingSec = Math.ceil((inventoryUpgradeExpireTime - now) / 1000);
                        const mins = Math.floor(remainingSec / 60);
                        const secs = remainingSec % 60;
                        text = `INVENTORY (${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')})`;
                    } else if (coins < inventoryUpgradePrice) disabled = true;
                    else text = `INVENTORY (${inventoryUpgradePrice})`;
                }

                drawSingleButton(btn, text, disabled);
            }
        }

        function drawSkinsMenu() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`Coins: ${coins}`, canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText('SKINS', canvas.width / 2, canvas.height * 0.32);

            const skinY = canvas.height * 0.42;
            const btnWidth = Math.min(canvas.width * 0.7, 250);
            const btnHeight = Math.max(40, Math.min(canvas.height * 0.07, 50));
            const spacing = btnHeight * 0.3;

            let yPos = skinY;
            for (let skinId in SKINS) {
                const skin = SKINS[skinId];
                const isActive = currentSkin.toLowerCase() === skin.id.toLowerCase();
                const isOwned = skin.purchased;
                
                if (isOwned) {
                    ctx.fillStyle = isActive ? 'rgba(255, 215, 0, 0.15)' : 'rgba(255, 255, 255, 0.05)';
                    ctx.beginPath();
                    ctx.roundRect(canvas.width / 2 - btnWidth / 2, yPos, btnWidth, btnHeight, 10);
                    ctx.fill();
                    
                    ctx.strokeStyle = isActive ? '#FFD700' : 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = isActive ? 2 : 1;
                    ctx.stroke();

                    let displayName = skin.name;
                    if (isActive) displayName = `> ${displayName}`;

                    ctx.fillStyle = isActive ? '#FFD700' : '#FFFFFF';
                    const btnFontSize = Math.max(12, Math.min(btnHeight * 0.35, 16));
                    ctx.font = `bold ${btnFontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(displayName, canvas.width / 2, yPos + btnHeight / 2);

                    yPos += btnHeight + spacing;
                }
            }

            drawButtons(skinsMenuButtons);
        }

        function drawSkinsShop() {
            const fontSizeTitle = Math.max(22, Math.min(canvas.width * 0.065, 34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(22, fontSizeTitle * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`Coins: ${coins}`, canvas.width / 2, Math.max(20, safeTop + 10));

            ctx.font = `bold ${fontSizeTitle}px Arial`;
            ctx.textBaseline = 'middle';
            ctx.fillText('SKIN SHOP', canvas.width / 2, canvas.height * 0.28);

            const skinShopStartY = canvas.height * 0.38;
            const btnWidth = Math.min(canvas.width * 0.7, 250);
            const btnHeight = Math.max(40, Math.min(canvas.height * 0.07, 50));
            const spacing = btnHeight * 0.3;

            let skinIndex = 0;
            for (let skinId in SKINS) {
                const skin = SKINS[skinId];
                if (skinId === 'DEFAULT') continue;

                if (!skin.purchased) {
                    const yPos = skinShopStartY + skinIndex * (btnHeight + spacing);
                    const disabled = coins < skin.price;
                    const text = `${skin.name} (${skin.price})`;
                    
                    const tempBtn = { x: canvas.width / 2 - btnWidth / 2, y: yPos, w: btnWidth, h: btnHeight };
                    drawSingleButton(tempBtn, text, disabled);
                    skinIndex++;
                }
            }

            drawButtons(skinsShopButtons);
        }

        function drawButtons(buttonsList) {
            for (let btn of buttonsList) {
                drawSingleButton(btn, btn.text, false);
            }
        }

        function drawSingleButton(btn, text, disabled) {
            ctx.fillStyle = disabled ? 'rgba(100, 100, 100, 0.3)' : 'rgba(255, 255, 255, 0.18)';
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10);
            ctx.fill();

            ctx.strokeStyle = disabled ? 'rgba(255, 255, 255, 0.2)' : '#FFFFFF';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = disabled ? '#888888' : '#FFFFFF';
            const btnFontSize = Math.max(11, Math.min(btn.h * 0.38, 15));
            ctx.font = `bold ${btnFontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, btn.x + btn.w / 2, btn.y + btn.h / 2);
        }

        function drawPauseMenu() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(26, canvas.width * 0.065)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('PAUSE', canvas.width / 2, canvas.height * 0.35);

            drawButtons(pauseMenuButtons);
        }

        function drawUnpauseCountdown() {
            const remainingSec = Math.ceil((unpauseEndTime - Date.now()) / 1000);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(44, canvas.width * 0.1)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(remainingSec > 0 ? remainingSec : 'GO!', canvas.width / 2, canvas.height / 2 - 20);
        }

        function draw() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.5, '#0d0d2b');
            gradient.addColorStop(1, '#050510');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let star of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            if (gameState === 'MAIN_MENU') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                drawMainMenu();
            }
            else if (gameState === 'SHOP') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                drawShop();
            }
            else if (gameState === 'SKINS') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                drawSkinsMenu();
            }
            else if (gameState === 'SKINS_SHOP') {
                const menuRocketAngle = Math.cos(menuRocket.time) * 0.12;
                const skinImagesSet = getCurrentSkinImages();
                drawRotatedImage(skinImagesSet.fly, menuRocket.x, menuRocket.y, menuRocket.width, menuRocket.height, menuRocketAngle);
                drawSkinsShop();
            }
            else if (gameState === 'WAITING_TO_START') {
                const skinImagesSet = getCurrentSkinImages();
                drawRotatedImage(skinImagesSet.idle, rocket.x, rocket.y, rocket.width, rocket.height, 0);
                drawUI();

                ctx.fillStyle = '#FFFFFF';
                const hintFont = Math.max(13, Math.min(canvas.width * 0.04, 18));
                ctx.font = `bold ${hintFont}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('TAP TO START', canvas.width / 2, canvas.height * 0.72);
            }
            else if (gameState === 'PLAYING' || gameState === 'UNPAUSING' || gameState === 'PAUSED' || gameState === 'GAMEOVER') {
                for (let c of canisters) {
                    drawRotatedImage(imgFuel, c.x, c.y, c.size, c.size, c.angle);
                }

                for (let coinObj of gameCoinsList) {
                    const coinImageToDraw = coinObj.isExtra ? imgExstraCoin : imgCoin;
                    drawRotatedImage(coinImageToDraw, coinObj.x, coinObj.y, coinObj.size, coinObj.size, coinObj.angle);
                }

                const skinImagesSet = getCurrentSkinImages();
                const currentTexture = rocket.velocity < 0 ? skinImagesSet.fly : skinImagesSet.idle;
                drawRotatedImage(currentTexture, rocket.x, rocket.y, rocket.width, rocket.height, rocket.angle);

                drawUI();

                if (gameState === 'PAUSED') drawPauseMenu();
                if (gameState === 'UNPAUSING') drawUnpauseCountdown();

                if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `bold ${Math.max(26, canvas.width * 0.075)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                    
                    ctx.font = `bold ${Math.max(13, canvas.width * 0.038)}px Arial`;
                    ctx.fillText('TAP TO RESTART', canvas.width / 2, canvas.height / 2 + 25);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resize();
        loop();
    </script>
</body>
</html>
